- platform: template
  name: "send button"
  id: "send_button"
  internal: true
  on_press:
    - uart.write: !lambda |-
        // Ensure at least 150ms has passed since our last transmission
        // before sending another command - this gives the air handler's
        // response to the previous query time to fully arrive before we
        // key up on the shared RS-485 bus again. Without this, a command
        // sent while a response is still in flight causes a bus collision
        // that corrupts the in-flight response (confirmed via a real
        // capture: dropped bytes mid-frame, misread by the fixed 32-byte
        // "after: bytes:" chunking in uart.yaml as valid data, producing a
        // burst of bogus error codes / impossible temperatures for one
        // read cycle).
        uint32_t since_last_tx = millis() - id(last_tx_millis);
        if (since_last_tx < 150) {
          delay(150 - since_last_tx);
        }
        id(last_tx_millis) = millis();

        static std::vector<uint8_t> sendData = {0xaa, 0xc3, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3c, 0x00, 0x55};
        sendData[6] = id(op_bytes);
        sendData[7] = id(fan_bytes);
        if (id(use_fahrenheit)) {
          sendData[8] = id(set_temp) + 0x87;
        } else {
          sendData[8] = id(set_temp);
        }

        sendData[9] = id(timer_start_bytes);
        sendData[10] = id(timer_stop_bytes);
        sendData[11] = id(unit_mode_flags_bytes);
        ESP_LOGI("custom","Getting ready to send: op %02X fan %02X temp %02X",id(op_bytes),id(fan_bytes),id(set_temp));
        uint8_t i=0;
        uint32_t crc=0;
        int len=16;
        for(i=0;i<len;i++)
        {
          if(i!=14)
          {
            crc+=sendData[i];
          }
        }
        ESP_LOGI("custom","sum of values for CRC calc is %i",crc);
        sendData[14] = 0xFF - (crc&0xFF);
        ESP_LOGI("custom","calculated CRC is %x",crc);
        return sendData;

- platform: template
  name: "Send Follow-Me/Gear State"
  id: "send_c6_button"
  internal: true
  on_press:
    - uart.write: !lambda |-
        // See send_button for why this guard exists.
        uint32_t since_last_tx = millis() - id(last_tx_millis);
        if (since_last_tx < 150) {
          delay(150 - since_last_tx);
        }
        id(last_tx_millis) = millis();

        // This single C6 frame always conveys BOTH the current Follow-Me
        // state (byte 10 subcommand + byte 11 room temp) and the current
        // GEAR tier (byte 8) together - the air handler reads byte 8 as
        // "current GEAR tier" on every C6 frame it receives, regardless
        // of what the subcommand is for, so any C6 send that omits it
        // silently resets GEAR back to Off. Keeping both concerns in one
        // frame-builder guarantees they can never drift out of sync.
        enum PacketType {
          INIT,
          UPDATE,
          STOP
        };
        static std::vector<uint8_t> c6Data = {0xaa, 0xc6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x39, 0x00, 0x55};

        c6Data[8] = id(gear_raw);

        PacketType packet = INIT;
        double followMeTemp = id(follow_me_temp).state;

        // Some operating modes don't support Follow-Me tracking at all -
        // a real KJR confirmed this by sending a Follow-Me STOP whenever
        // switching to Fan-only or Dry, and a fresh INIT (not just an
        // UPDATE) whenever switching back to Heat or Cool, even though
        // the user's Follow-Me preference never changed. We mirror that
        // by deriving "is Follow-Me actually wanted right now" from BOTH
        // the switch AND the current mode's capability - this also means
        // follow_me_init naturally gets reset to false by the STOP branch
        // whenever we leave a capable mode, so re-entering one later
        // automatically triggers a fresh INIT rather than resuming as an
        // UPDATE, with no extra state tracking needed here.
        bool mode_supports_follow_me = (id(op_bytes) == 0x84 || id(op_bytes) == 0x88);
        bool want_follow_me = id(follow_me).state && mode_supports_follow_me;

        if (want_follow_me) {
          if (id(follow_me_init)) {
            c6Data[10] = 0x42;
            packet = UPDATE;
          } else {
            c6Data[10] = 0x46;
            id(follow_me_init) = true;
            packet = INIT;
          }
        } else {
          c6Data[10] = 0x44;
          id(follow_me_init) = false;
          packet = STOP;
        }

        // Turbo is layered onto the Follow-Me subcommand as an
        // independent flag bit (0x08), confirmed via a real KJR capture
        // showing byte10=0x4E = 0x40 (base) | 0x06 (INIT) | 0x08 (TURBO).
        // Only ever observed composed with INIT so far - untested with
        // UPDATE/STOP, so this is a testing probe to see how a REAL air
        // handler responds, not a confirmed-correct implementation yet.
        if (id(turbo_active)) {
          c6Data[10] |= 0x08;
        }

        if (id(smart_rounding)) {
          bool compressor_on = (id(uptime_sensor).state - id(last_compressor_off_time) < 120 && id(uptime_sensor).state > 120) || id(compressor_status).state;
          uint8_t set_point = id(use_fahrenheit) ? ((id(set_temp) - 32.0) * (5.0 / 9.0)) : id(set_temp);

          switch (id(op_bytes)) {
            case 0x84: // heat
              if (fabs(set_point - followMeTemp) > 0.5) {
                c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
                break;
              }
              if (compressor_on) {
                c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
              } else {
                c6Data[11] = static_cast<uint8_t>(std::ceil(followMeTemp));
              }
              break;
            case 0x88: // cool
              if (fabs(set_point - followMeTemp) > 0.5) {
                c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
                break;
              }
              if (compressor_on) {
                c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
              } else {
                c6Data[11] = static_cast<uint8_t>(std::floor(followMeTemp));
              }
              break;
            default:
              c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
              break;
          }
        } else {
          c6Data[11] = static_cast<uint8_t>(std::round(followMeTemp));
        }

        switch (packet) {
          case INIT:
            ESP_LOGI("follow_me", "Sending C6: Follow-Me INIT, temp=%iC, gear raw=0x%02X", c6Data[11], id(gear_raw));
            break;
          case UPDATE:
            ESP_LOGI("follow_me", "Sending C6: Follow-Me UPDATE, temp=%iC, gear raw=0x%02X", c6Data[11], id(gear_raw));
            break;
          case STOP:
            ESP_LOGI("follow_me", "Sending C6: Follow-Me STOP (T1 will revert to internal sensor), gear raw=0x%02X", id(gear_raw));
            break;
        }

        uint8_t i = 0;
        uint32_t crc = 0;
        int len = 16;
        for (i = 0; i < len; i++) {
          if (i != 14) {
            crc += c6Data[i];
          }
        }
        c6Data[14] = 0xFF - (crc & 0xFF);

        id(last_follow_me_send_time) = static_cast<uint32_t>(id(uptime_sensor).state);

        if (id(uptime_sensor).state - id(last_follow_me_update) > ${follow_me_timeout}) {
          id(follow_me).turn_off();
        }

        // We've now transmitted the current GEAR value and/or Follow-Me
        // mode-capability transition - safe to trust incoming C4 tier
        // reports again, and no need to force another immediate send.
        id(follow_me_mode_change_pending) = false;

        // We've now transmitted the current GEAR value and Turbo state -
        // safe to trust incoming C4 tier reports again, and no need to
        // force another immediate send.
        id(c6_pending) = false;

        return c6Data;
