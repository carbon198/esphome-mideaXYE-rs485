- interval: 1.5s
  startup_delay: 20s
  then:
    if:
      condition:
        lambda: 'return id(first_boot) || (!id(command_sent) && !id(new_input));'
      then:
        - lambda: |-
            // Decide whether a Follow-Me packet (INIT/UPDATE/STOP) needs to
            // go out this tick. The actual frame is built and sent by
            // send_follow_me_button, so this scheduled path and any manual
            // press (e.g. from the Gear button's underlying logic) share
            // one code path.
            bool due = (id(uptime_sensor).state - id(last_follow_me_send_time) >= ${follow_me_interval}) && (id(op_bytes) != 0x00);
            id(follow_me_due) = due && (id(follow_me).state || id(follow_me_init));
            if (id(follow_me_due)) {
              id(send_follow_me_button).press();
            }
        - if:
            condition:
              lambda: 'return !id(follow_me_due);'
            then:
              - uart.write: !lambda |-
                  static std::vector<uint8_t> queryData = {0xaa, 0xc0, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3F, 0x81, 0x55};
                  static std::vector<uint8_t> queryDataC4 = {0xAA, 0xC4, 0x00, 0x00, 0x00, 0x00, 0xA5, 0x5A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3B, 0x02, 0x55};

                  // alternate between C0 and C4 queries to keep our sensors up to date
                  if (id(alternate_query)) {
                    id(alternate_query) = false;
                    return queryDataC4;
                  } else {
                    id(alternate_query) = true;
                    return queryData;
                  }

- interval: 3s
  startup_delay: 10s
  then:
    - lambda: |-
        if (!id(first_boot) && !id(new_input) && id(climate_entity).mode == climate::CLIMATE_MODE_HEAT_COOL) {
          float current_temp = id(follow_me).state ? id(follow_me_temp).state : id(t1_temp).state;

          if (id(op_bytes) != 0x84 && current_temp <= id(climate_entity).target_temperature_low) {
            ESP_LOGI("custom","changing to heat mode");
            id(op_bytes) = 0x84;
            float low_temp = id(climate_entity).target_temperature_low;
            if (id(use_fahrenheit)) {
              low_temp = low_temp * (9.0/5.0) + 32.0;
            }
            id(set_temp) = low_temp;
            id(new_input) = true;
          }

          if (id(op_bytes) != 0x88 && current_temp >= id(climate_entity).target_temperature_high) {
            ESP_LOGI("custom","changing to cool mode");
            id(op_bytes) = 0x88;
            float high_temp = id(climate_entity).target_temperature_high;
            if (id(use_fahrenheit)) {
              high_temp = high_temp * (9.0/5.0) + 32.0;
            }
            id(set_temp) = high_temp;
            id(new_input) = true;
          }
        }

        // if we have new data to send, send the update packet
        if (!id(first_boot) && id(new_input) && !id(command_sent)) {
          id(send_button).press();
          id(new_input) = false;
          id(command_sent) = true;
        }
