- interval: 1.5s
  startup_delay: 20s
  then:
    if:
      condition:
        lambda: 'return id(first_boot) || (!id(command_sent) && !id(new_input));'
      then:
        - lambda: |-
            // Detect crossing the Follow-Me capability boundary (see
            // send_c6_button for why this matters) so we can force an
            // immediate send instead of waiting out the normal interval.
            bool current_capable_mode = (id(op_bytes) == 0x84 || id(op_bytes) == 0x88);
            if (current_capable_mode != id(last_follow_me_capable_mode)) {
              id(last_follow_me_capable_mode) = current_capable_mode;
              if (id(follow_me).state) {
                ESP_LOGI("follow_me", "Operating mode %s Follow-Me (op_bytes=0x%02X) - sending updated state immediately",
                         current_capable_mode ? "now supports" : "no longer supports", id(op_bytes));
                id(follow_me_mode_change_pending) = true;
              }
            }

            // Decide whether a C6 packet needs to go out this tick. There
            // are three independent reasons to send one:
            //  1. A real Follow-Me update/init is due (normal interval
            //     elapsed, and Follow-Me is active or needs a STOP).
            //  2. The user just changed the GEAR select (gear_pending) -
            //     bypasses the elapsed-time check since GEAR works
            //     independently of Follow-Me state.
            //  3. The operating mode just crossed the Follow-Me
            //     capability boundary (follow_me_mode_change_pending).
            // Either way, the actual frame is built by send_c6_button,
            // which always carries the current Follow-Me state and GEAR
            // tier together.
            bool unit_online = (id(op_bytes) != 0x00);
            bool follow_me_interval_elapsed = (id(uptime_sensor).state - id(last_follow_me_send_time) >= ${follow_me_interval});
            bool follow_me_reason = unit_online && follow_me_interval_elapsed && (id(follow_me).state || id(follow_me_init));
            bool gear_reason = unit_online && id(gear_pending);
            bool mode_change_reason = unit_online && id(follow_me_mode_change_pending);

            id(follow_me_due) = follow_me_reason || gear_reason || mode_change_reason;
            if (id(follow_me_due)) {
              id(send_c6_button).press();
            }
        - if:
            condition:
              lambda: 'return !id(follow_me_due);'
            then:
              - uart.write: !lambda |-
                  uint32_t since_last_tx = millis() - id(last_tx_millis);
                  if (since_last_tx < 150) {
                    delay(150 - since_last_tx);
                  }
                  id(last_tx_millis) = millis();

                  static std::vector<uint8_t> queryData = {0xaa, 0xc0, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3F, 0x81, 0x55};
                  static std::vector<uint8_t> queryDataC4 = {0xAA, 0xC4, 0x00, 0x00, 0x00, 0x00, 0xA5, 0x5A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3B, 0x02, 0x55};

                  if (id(alternate_query)) {
                    id(alternate_query) = false;
                    return queryDataC4;
                  } else {
                    id(alternate_query) = true;
                    return queryData;
                  }

- interval: 3s
  startup_delay: 10s
  then:
    - lambda: |-
        if (!id(first_boot) && !id(new_input) && id(climate_entity).mode == climate::CLIMATE_MODE_HEAT_COOL) {
          float current_temp = id(follow_me).state ? id(follow_me_temp).state : id(t1_temp).state;

          if (id(op_bytes) != 0x84 && current_temp <= id(climate_entity).target_temperature_low) {
            ESP_LOGI("custom","changing to heat mode");
            id(op_bytes) = 0x84;
            float low_temp = id(climate_entity).target_temperature_low;
            if (id(use_fahrenheit)) {
              low_temp = low_temp * (9.0/5.0) + 32.0;
            }
            id(set_temp) = low_temp;
            id(new_input) = true;
          }

          if (id(op_bytes) != 0x88 && current_temp >= id(climate_entity).target_temperature_high) {
            ESP_LOGI("custom","changing to cool mode");
            id(op_bytes) = 0x88;
            float high_temp = id(climate_entity).target_temperature_high;
            if (id(use_fahrenheit)) {
              high_temp = high_temp * (9.0/5.0) + 32.0;
            }
            id(set_temp) = high_temp;
            id(new_input) = true;
          }
        }

        // if we have new data to send, send the update packet
        if (!id(first_boot) && id(new_input) && !id(command_sent)) {
          id(send_button).press();
          id(new_input) = false;
          id(command_sent) = true;
        }
