- platform: template
  name: "Gear"
  id: gear_select
  optimistic: true
  options:
    - "Off"
    - "50%"
    - "75%"
  initial_option: "Off"
  set_action:
    - lambda: |-
        if (x == "Off") {
          id(gear_raw) = 0x00;
        } else if (x == "50%") {
          id(gear_raw) = 0x40;
        } else if (x == "75%") {
          id(gear_raw) = 0x60;
        }
        id(gear_pending) = true;
    # Confirmed via a real KJR capture: selecting a nonzero GEAR level
    # clears Turbo. Only fires when actually turning GEAR ON (not when
    # selecting "Off"), since we have no evidence GEAR-off affects Turbo.
    - if:
        condition:
          lambda: 'return x != "Off";'
        then:
          - switch.turn_off: turbo_mode_switch
