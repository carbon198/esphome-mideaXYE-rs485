- platform: template
  name: "Gear"
  id: gear_select
  optimistic: true
  options:
    - "Off"
    - "50%"
    - "75%"
  initial_option: "Off"
  set_action:
    - lambda: |-
        if (x == "Off") {
          id(gear_raw) = 0x00;
        } else if (x == "50%") {
          id(gear_raw) = 0x40;
        } else if (x == "75%") {
          id(gear_raw) = 0x60;
        }
        // Don't send here - the 1.5s interval loop picks this up as a
        // reason to press send_c6_button on its next tick (see
        // intervals.yaml), keeping ALL C6 sends scheduled through one
        // place instead of two different trigger paths.
        id(gear_pending) = true;
