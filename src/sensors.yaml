# internal temp of esp device
- platform: internal_temperature
  name: "Internal Temperature"
  state_class: measurement
  device_class: temperature
  unit_of_measurement: "°C"

# dont change any of these temps to be F. They are always reported in C. If you want to display them in F, you can change the temperature unit in the home assistant UI

# T1 temp is either the return air or the follow me temp. When you toggle follow me this value should be replaced by the follow me value
- platform: template
  name: "T1 Room Temp"
  unit_of_measurement: "°C"
  id: t1_temp
  update_interval: 1s
  device_class: temperature
  state_class: measurement

- platform: template
  name: "Current Setpoint"
  unit_of_measurement: "${'°F' if use_fahrenheit == true else '°C'}"
  id: tset
  update_interval: 1s
  device_class: temperature
  state_class: measurement
  lambda: |-
    return id(set_temp);

# Indoor coil. A appears to be the temp prior to air passing over the coil while B is the temp before  
- platform: template
  name: "T2A Indoor Coil Temp A"
  id: t2a_temp
  unit_of_measurement: "°C"
  update_interval: 1s
  device_class: temperature
  state_class: measurement

- platform: template
  name: "T2B Indoor Coil Temp B"
  id: t2b_temp
  unit_of_measurement: "°C"
  update_interval: 1s
  device_class: temperature
  state_class: measurement

- platform: template
  name: "T3 Outdoor Coil Temp"
  id: t3_temp
  unit_of_measurement: "°C"
  update_interval: 1s
  device_class: temperature
  state_class: measurement

- platform: template
  name: "T4 Outdoor Temp"
  id: t4_temp
  unit_of_measurement: "°C"
  update_interval: 1s
  device_class: temperature
  state_class: measurement

- platform: uptime
  id: uptime_sensor
  name: "Uptime Sensor"
  type: seconds
  update_interval: 1s
  internal: True

- platform: template
  name: "System Status Flags (Raw)"
  id: system_status_flags_raw
  entity_category: diagnostic
  state_class: measurement

- platform: template
  # Meaning unconfirmed - exploratory raw byte, published to help find
  # what it means by comparing values across different operating states.
  name: "C0 Byte 28 (Raw)"
  id: c0_byte28_raw
  entity_category: diagnostic
  state_class: measurement

- platform: template
  # High byte of what appears to be a 16-bit little-endian value with byte 28
  # (0x01E0 = 480 at idle). Unconfirmed.
  name: "C0 Byte 29 (Raw)"
  id: c0_byte29_raw
  entity_category: diagnostic
  state_class: measurement

- platform: template
  # Hypothesis (unconfirmed): C0 bytes 28-29 are the indoor EEV step position,
  # little-endian, 0-480 steps. Assumes 480 = fully open (it sits at 480 in
  # heating and idle, and drops below it while cooling), so this is shown
  # inverted: 0% = fully open, 100% = fully closed. Polarity not verified.
  name: "EEV Throttle"
  id: eev_throttle
  unit_of_measurement: "%"
  accuracy_decimals: 1
  state_class: measurement

# Exploratory: documented as compressor frequency / fan RPM (high/low byte)
# but has read a constant 0xBC 0xD6 in every C4 capture so far. Published raw
# so it can be overlaid against C0 byte 28 to see whether they are related.
- platform: template
  name: "C4 Byte 19 (Raw)"
  id: c4_byte19_raw
  entity_category: diagnostic
  state_class: measurement

- platform: template
  name: "C4 Byte 20 (Raw)"
  id: c4_byte20_raw
  entity_category: diagnostic
  state_class: measurement
